name: Explore API
# One-off diagnostics: prints the raw shape of Travelpayouts responses. Manual only.
on: workflow_dispatch
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/explore_api.py
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
